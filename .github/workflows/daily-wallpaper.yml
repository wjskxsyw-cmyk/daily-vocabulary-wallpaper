name: Daily Insight wallpaper

on:
  schedule:
    # Prepare tomorrow before midnight, then recover during the following day.
    - cron: '17 21 * * *'
    - cron: '17 3,9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generate.py'
      - 'test_generate.py'
      - 'verify_public.py'
      - 'data/insights.json'
      - 'requirements.txt'
      - '.github/workflows/daily-wallpaper.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Validate every insight and palette, then render today
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python -m unittest
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from generate import make, TIMEZONE
          chosen = datetime.now(ZoneInfo(TIMEZONE)).date()
          if os.getenv('EVENT_NAME') == 'schedule' and os.getenv('SCHEDULE_CRON') == '17 21 * * *':
              utc = datetime.now(timezone.utc)
              # If the evening trigger is delayed past UTC midnight, use today.
              chosen = utc.date() + timedelta(days=int(utc.hour >= 21))
          make(chosen)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public date, content ID and exact PNG hash
        run: python verify_public.py
