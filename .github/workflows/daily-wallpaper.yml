name: Daily bilingual wallpaper

on:
  schedule:
    # Europe/Belgrade midnight occurs at 22:00 UTC (summer) or 23:00 UTC (winter).
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Belgrade local time for scheduled runs
        id: timing
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LOCAL_HOUR=$(TZ=Europe/Belgrade date +%H)
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$LOCAL_HOUR" == "00" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.timing.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fonts and dependencies
        if: steps.timing.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          pip install -r requirements.txt
      - name: Render wallpaper
        if: steps.timing.outputs.run == 'true'
        run: python generate.py
      - uses: actions/configure-pages@v5
        if: steps.timing.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.timing.outputs.run == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: steps.timing.outputs.run == 'true'
        id: deployment
