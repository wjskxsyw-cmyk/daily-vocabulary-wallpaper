name: Daily Insight wallpaper

on:
  schedule:
    # Both sides of local midnight, plus a recovery run. No fragile hour gate.
    - cron: '17 22,23,3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generate.py'
      - 'test_generate.py'
      - 'verify_public.py'
      - 'data/insights.json'
      - 'requirements.txt'
      - '.github/workflows/daily-wallpaper.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Validate every insight and palette, then render today
        run: |
          python -m unittest
          python generate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public date, content ID and exact PNG hash
        run: python verify_public.py
